        <h1>Submit Your Suggestions for the Website</h1>
        <form id="suggestionForm">
            <label for="name">Enter your name:</label><br>
            <input type="text" id="name" name="name"><br>
    
            <label for="anonymous">Submit anonymously:</label>
            <input type="checkbox" id="anonymous" name="anonymous"><br><br>

            <textarea id="suggestion" name="suggestion" rows="4" required></textarea><br>
    
            <input type="submit" value="Submit Suggestion">
        </form>
